name: Scraper checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scraper:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scraper_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: scraper_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-scraper.txt
      - run: python -m pip install -r requirements-scraper.txt
      - run: python -m unittest discover -s test
        env:
          PYTHONPATH: .
          TEST_POSTGRES_URL: postgresql://scraper_test:local_test_only@127.0.0.1:5432/scraper_test
